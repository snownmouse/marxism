# 把这段放进 1949 端口的 server 块里（/etc/nginx/sites-available/default）
# 作用：站点同源转发 /api/* 到本机 1960 的小原代理，前端因此不需要任何跨域或密钥。

location /api/ {
    proxy_pass http://127.0.0.1:1960/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    client_max_body_size 1m;
}

# 若站点是 SPA 且 location / 用了 try_files，注意 /api/ 必须写在 location / 之前，
# nginx 前缀匹配按最长前缀优先，顺序其实不影响，但放在前面便于阅读。
